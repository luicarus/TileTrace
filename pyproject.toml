[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-transform-visualizer"
version = "0.1.0"
description = "Static Triton tensor transformation explanations for editors and agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
triton-transform = "triton_transform.__main__:main"

[tool.setuptools.packages.find]
include = ["triton_transform*"]
